name: Generate Snake
on:
  schedule:
    - cron: "0 0 * * *" # Обновляется каждый день в полночь
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=ff4d00&color_dots=#F4F4F0,#ccff00,#a3cc00,#7a9900,#526600
            dist/github-snake-dark.svg?palette=github-dark&color_snake=ff4d00
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
